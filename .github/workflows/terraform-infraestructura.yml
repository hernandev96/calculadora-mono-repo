name: Terraform Infraestructura (Despliegue)

# Trigger que se ejecuta en push a main, branches de feature y fix, y cambios en infra/terraform
on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths: ["infra/terraform/**"]
  pull_request:
    branches: [main, "feature/**", "fix/**"]
    paths: ["infra/terraform/**"]
# Permisos necesarios para la autenticación con AWS y el despliegue
permissions:
  id-token: write
  contents: read
# Ejecuta los pasos de Terraform para planificar y aplicar cambios
jobs:
  # Ejecuta los pasos de Terraform para planificar y aplicar cambios
  terraform:
    runs-on: ubuntu-latest
    # Ejecuta los pasos de Terraform para planificar y aplicar cambios
    steps:
      # Clona el repositorio para acceder a los archivos de Terraform
      - name: Clonar repositorio
        uses: actions/checkout@v3
      # Configura las credenciales de AWS para autenticación con OIDC
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # Verifica la identidad de AWS para confirmar la autenticación
      - name: Verificar identidad (Test)
        run: |
          aws sts get-caller-identity
          echo "✅ Autenticación exitosa con OIDC"
      # Inicializa Terraform y planifica los cambios
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      # Inicializa Terraform y planifica los cambios
      - name: Iniciar Terraform
        run: terraform init
        working-directory: infra/terraform
      # Planifica los cambios de Terraform
      - name: Planificar Terraform
        run: terraform plan
        working-directory: infra/terraform
      # Aplica los cambios planificados de Terraform
      - name: Aplicar Terraform
        run: terraform apply -auto-approve
        working-directory: infra/terraform
        if: ${{ github.event_name == 'push' }}

      # Extraer outputs de Terraform y exponerlos como salidas del step
      - name: Exportar outputs de Terraform
        id: tf_outputs
        run: |
          cd infra/terraform
          terraform output -json > tf_outputs.json
          # String outputs
          echo "vpc_id=$(jq -r '.vpc_id.value // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(jq -r '.eks_cluster_name.value // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "eks_cluster_endpoint=$(jq -r '.eks_cluster_endpoint.value // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "eks_cluster_arn=$(jq -r '.eks_cluster_arn.value // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "eks_node_group_name=$(jq -r '.eks_node_group_name.value // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "terraform_state_bucket=$(jq -r '.terraform_state_bucket.value // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "terraform_locks_table=$(jq -r '.terraform_locks_table.value // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "alb_dns_name=$(jq -r '.alb_dns_name.value // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "alb_arn=$(jq -r '.alb_arn.value // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          # Array outputs (join with comma)
          echo "public_subnets=$(jq -r '.public_subnets.value | join(",") // ""' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "private_subnets=$(jq -r '.private_subnets.value | join(",") // ""' tf_outputs.json)" >> $GITHUB_OUTPUT

      # Guardar outputs de Terraform como secretos en el repositorio
      - name: Establecer secreto TF_VPC_ID
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_VPC_ID
          secret_value: ${{ steps.tf_outputs.outputs.vpc_id }}

      - name: Establecer secreto TF_PUBLIC_SUBNETS
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_PUBLIC_SUBNETS
          secret_value: ${{ steps.tf_outputs.outputs.public_subnets }}

      - name: Establecer secreto TF_PRIVATE_SUBNETS
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_PRIVATE_SUBNETS
          secret_value: ${{ steps.tf_outputs.outputs.private_subnets }}

      - name: Establecer secreto TF_EKS_CLUSTER_NAME
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_EKS_CLUSTER_NAME
          secret_value: ${{ steps.tf_outputs.outputs.eks_cluster_name }}

      - name: Establecer secreto TF_EKS_CLUSTER_ENDPOINT
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_EKS_CLUSTER_ENDPOINT
          secret_value: ${{ steps.tf_outputs.outputs.eks_cluster_endpoint }}

      - name: Establecer secreto TF_EKS_CLUSTER_ARN
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_EKS_CLUSTER_ARN
          secret_value: ${{ steps.tf_outputs.outputs.eks_cluster_arn }}

      - name: Establecer secreto TF_EKS_NODE_GROUP_NAME
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_EKS_NODE_GROUP_NAME
          secret_value: ${{ steps.tf_outputs.outputs.eks_node_group_name }}

      - name: Establecer secreto TF_STATE_BUCKET
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_STATE_BUCKET
          secret_value: ${{ steps.tf_outputs.outputs.terraform_state_bucket }}

      - name: Establecer secreto TF_LOCKS_TABLE
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_LOCKS_TABLE
          secret_value: ${{ steps.tf_outputs.outputs.terraform_locks_table }}

      - name: Establecer secreto TF_ALB_DNS_NAME
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_ALB_DNS_NAME
          secret_value: ${{ steps.tf_outputs.outputs.alb_dns_name }}

      - name: Establecer secreto TF_ALB_ARN
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret_name: TF_ALB_ARN
          secret_value: ${{ steps.tf_outputs.outputs.alb_arn }}

      # Dorme durante 300 segundos para permitir que los cambios se apliquen
      - name: dormir
        run: sleep 300s
      # Destruye la infraestructura aplicada por Terraform
      - name: destruir infraestructura
        run: terraform destroy -auto-approve
        working-directory: infra/terraform
        if: ${{ github.event_name == 'push' }}
